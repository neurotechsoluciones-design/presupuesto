name: One-time Bruno hero upload

on:
  push:
    paths:
      - '.github/workflows/upload-bruno-hero.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and prepare hero image
        env:
          HERO_URL: "https://media.canva.com/v2/document-image/hash:190946736/height:334/id:DAHXS4XJSRw/type:B/width:598?brand=BAGlRvTYAZg&csig=AAAAAAAAAAAAAAAAAAAAAJdd_XQnWoKN71XrRBCD-x3K9pO5QloPzoH3Hh95TII6&exp=1791345293&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FXJSRw%2FDAHXS4XJSRw%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261006%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261006T145359Z%26X-Amz-Expires%3D49554%26X-Amz-Signature%3Dec68f42d931ee6dfb50dcf08518e3932bec83470efe23ea82a2c24066086a491%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252007%2520Oct%25202026%252004%253A39%253A53%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAMS_rTwTQMTc9GqOQykLj36ug_wVB3451y_IE1B7yqWn&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          mkdir -p bruno-lecla
          curl -L --fail --retry 3 "$HERO_URL" -o /tmp/hero-small.jpg
          echo "Source bytes: $(wc -c < /tmp/hero-small.jpg)"
          test $(wc -c < /tmp/hero-small.jpg) -gt 10000
          ffmpeg -y -i /tmp/hero-small.jpg -vf "scale=2048:1143:flags=lanczos,unsharp=5:5:0.75:5:5:0.0" -q:v 2 bruno-lecla/hero-bruno.jpg
          echo "Final bytes: $(wc -c < bruno-lecla/hero-bruno.jpg)"
          test $(wc -c < bruno-lecla/hero-bruno.jpg) -gt 100000
      - name: Commit hero image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bruno-lecla/hero-bruno.jpg
          git commit -m "[hero-upload] Add Bruno hero image"
          git push
